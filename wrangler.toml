# اسم باید دقیقاً همان Worker فعلی باشد (آدرس: bet.ualireza82.workers.dev)
name = "bet"
main = "worker.js"
compatibility_date = "2025-01-01"

# دیتابیس D1  (database_id را از داشبورد: Storage & Databases ← D1 ← aj-predict بردار)
[[d1_databases]]
binding = "DB"
database_name = "aj-predict"
database_id = "a03e6f36-12e6-45b4-b23a-d9f63fb250c3"

# KV  (id را از داشبورد: Storage & Databases ← KV ← CACHE بردار)
[[kv_namespaces]]
binding = "CACHE"
id = "9036c2bc758f4ca285790bfd808a4d6d"

# تسویه خودکار نتایج و دوئل‌ها، هر ۲ دقیقه
[triggers]
crons = ["*/2 * * * *"]

[observability]
enabled = true

# متغیرهای معمولی (Text). بعد از Deploy مقدارهای داشبورد با این‌ها جایگزین می‌شوند.
[vars]
TZ = "Asia/Tehran"
TZ_OFFSET = "+03:30"
ADMIN_EMAILS = "shahriyarjadidi@gmail.com"

# Secretها را اینجا ننویس؛ همان‌هایی که در داشبورد زده‌ای می‌مانند:
#   API_KEY   و   SUPABASE_JWT_SECRET

